<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verity Sanctuary Versions</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg: #120f24; --panel: #2a2645; --hi: #4a4578; --lo: #1a1730; --text: #f1eeff; --muted: #a9a3d1; --yellow: #ffd23f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 20px/1.2 "VT323", monospace; padding: 32px 16px; }
    main { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
    h1 { margin: 0; font: 20px/1.4 "Press Start 2P", monospace; color: var(--yellow); text-shadow: 3px 3px 0 #000; }
    p { margin: 0; color: var(--muted); }
    .card { background: var(--panel); border: 4px solid #000; box-shadow: inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo), 6px 6px 0 #000; padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .card div { flex: 1; min-width: 180px; }
    .card b { display: block; font: 12px/1.6 "Press Start 2P", monospace; font-weight: normal; color: var(--yellow); }
    a.play { font: 10px "Press Start 2P", monospace; color: #000; background: var(--yellow); border: 3px solid #000; padding: 10px 12px; text-decoration: none; box-shadow: 3px 3px 0 #000; }
    a.play:hover { background: #ffe066; }
    .current { box-shadow: inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo), 6px 6px 0 #000, 0 0 0 3px #7df9ff; }
  </style>
</head>
<body>
  <main>
    <h1>VERITY SANCTUARY<br>VERSION ARCHIVE</h1>
    <p>Every major version, kept playable for reference. Each archived version has its own save, separate from your main game.</p>
    <div class="card current"><div><b>Latest version</b>The game as it is now.</div><a class="play" href="../index.html">PLAY</a></div>
    <div id="list" style="display:grid;gap:16px"></div>
  </main>
  <script src="list.js"></script>
  <script>
    const list = document.getElementById("list");
    VERSIONS.slice().reverse().forEach(x => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div><b>v${x.v} &middot; ${x.title}</b>Archived ${x.date}</div><a class="play" href="v${x.v}/index.html">PLAY v${x.v}</a>`;
      list.appendChild(card);
    });
  </script>
</body>
</html>
